<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>
	
	<a href="/www/Addform.html"><h3>新增學生</h3></a>
	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>{{ loop.index }}:<a href="/student/edit/{{p.stuid }}">Edit</a></td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}</td>		
		<td><a href="/student/delete/{{p.stuid }}">Delete</a></td>
	</tr>
	{% endfor %}
	</table>
</body>
</html>
